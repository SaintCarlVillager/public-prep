name: Validar
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar taxonomia, normas, editais e provas
        run: python3 scripts/validar.py
      - name: Empacotar os dados do painel
        run: python3 scripts/empacotar.py
